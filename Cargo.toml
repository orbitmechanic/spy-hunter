[package]
name = "spy-hunter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "SPY HUNTER: INTERCEPTOR — an original 2D arcade tribute in Rust and Bevy 0.20.1"
license = "MIT"
repository = "https://github.com/orbitmechanic/spy-hunter"
keywords = ["bevy", "game", "arcade", "pixel-art", "spy-hunter"]
categories = ["games"]

[lib]
name = "spy_hunter"
path = "src/lib.rs"

[[bin]]
name = "spy-hunter"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", features = ["wav", "debug"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
